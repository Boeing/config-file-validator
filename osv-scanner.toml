# osv-scanner configuration
# https://google.github.io/osv-scanner/configuration/

# Go stdlib vulnerabilities. MegaLinter v9.6.0 ships Go 1.26.3 with
# GOTOOLCHAIN=local and osv-scanner 2.3.8 (which always scans go.mod version).
# These cannot be fixed without upgrading MegaLinter's container.
# Tracked in: https://github.com/Boeing/config-file-validator/issues/545
